      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var t =
            s ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="home-page">
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">

      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5z"/></svg>
