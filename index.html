<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ian Leung's personal site and resume." />
    <title>Ian Leung</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1ea;
        --bg-accent: #eadfce;
        --text: #1f1a17;
        --muted: #64584f;
        --card: rgba(255, 255, 255, 0.76);
        --border: rgba(71, 54, 44, 0.14);
        --shadow: 0 30px 80px rgba(64, 44, 28, 0.12);
        --link: #8c4f28;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 42%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .shell {
        width: min(720px, 100%);
      }

      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        padding: 40px;
      }

      .eyebrow {
        margin: 0 0 14px;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin: 18px 0 0;
        max-width: 38rem;
        font-size: 1.06rem;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid transparent;
        text-decoration: none;
        font-weight: 600;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--text);
        color: #fff;
      }

      .secondary {
        color: var(--text);
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.45);
      }

      .note {
        margin-top: 18px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .card {
          padding: 28px;
          border-radius: 24px;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="intro-title">
        <p class="eyebrow">Ian Leung</p>
        <h1 id="intro-title">Simple site, live resume.</h1>
        <p>
          The latest resume is published separately and mirrored here so it is always available at
          <a href="/resume">ianleung.com/resume</a>.
        </p>
        <div class="actions">
          <a class="primary" href="/resume">Open resume</a>
          <a class="secondary" href="https://ianleung12.github.io/CV/" target="_blank" rel="noreferrer">View source PDF</a>
        </div>
        <p class="note">The resume page is kept in sync with the GitHub Pages build from the CV repository.</p>
      </section>
    </main>
  </body>
</html>
